name: Release

# Tag-driven: test → build the production artifact → publish the redirect stub.
#
# The canonical deployment is https://xnotary.digital, on the operator's
# Cloudflare Pages account, and this workflow deliberately cannot reach it:
# there are no Cloudflare credentials here and connecting the Pages project to
# GitHub is the operator's call, not ours. What it does instead is produce the
# exact bytes that should be deployed — tested, built as the whole site (the
# front page at /, xNotary at /xnotary/) and with the security headers in place — and attach them to the run for whoever runs
# `wrangler pages deploy`. The bytes that ship are then the bytes CI tested.
#
# GitHub Pages serves a redirect stub to the canonical address. It is not a
# second production instance and must not become one again.
#
# It also publishes the GitHub release, from the tag's own annotation. That step
# used to be a manual `gh release create` and it drifted exactly as you would
# expect: v0.4.3 has a release, v0.4.4 has none, and v0.4.4 is not even an
# annotated tag. Automating it makes the tag message the single place a release
# is described.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-deployed static site is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  production:
    name: Production artifact for Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the build stamps `git describe` into the app
          # so the deployed page can link the exact source it was built from
          # (AGPL §13). A shallow checkout would leave it showing a bare SHA.
          fetch-depth: 0

      - name: Check the tag can be released
        # Runs before the build and before Pages is touched, because the whole
        # run is downstream of this job. A tag with no message cannot produce
        # release notes, and discovering that after the stub has already been
        # republished leaves a half-done release nobody can fix by re-running.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # actions/checkout leaves refs/tags/<tag> pointing at the commit
          # rather than at the tag object, even with fetch-depth: 0 — so the
          # annotation is simply not present to read until the tag ref is
          # fetched explicitly. Without this line every annotated tag looks
          # lightweight, which is exactly how v0.4.6 failed the first time this
          # ran. Keep it ahead of any command that reads the tag message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag, so it carries no message to release from. Delete it, re-tag with 'git tag -a' — first line 'vX.Y.Z — what changed', the rest the notes — and push again."
            exit 1
          fi
          if [ -z "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" ]; then
            echo "::error::$GITHUB_REF_NAME is annotated but its message is empty. The release notes come from that message."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            xsignature/app/package-lock.json
            xconvert/app/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm test

      - name: Install xSignature
        # xSignature (xsignature/app) is its own package, built into
        # dist/xsignature/ by `npm run build:only` below.
        run: npm ci --prefix ../xsignature/app

      - name: Type-check xSignature
        run: npm run typecheck --prefix ../xsignature/app

      - name: Test xSignature
        run: npm test --prefix ../xsignature/app
      - name: Install xConvert
        run: npm ci --prefix ../xconvert/app
      - name: Type-check xConvert
        run: npm run typecheck --prefix ../xconvert/app
      # xConvert's Typst wrapper is Rust, built here from source. rustup ships on the runner.
      - name: Add the WebAssembly target for xConvert's Typst wrapper
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            xconvert/typst-pdf/target
          key: typst-pdf-${{ runner.os }}-${{ hashFiles('xconvert/typst-pdf/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: xconvert/app/.vendor-cache
          key: xconvert-vendor-${{ hashFiles('xconvert/app/scripts/vendor.sh', 'xconvert/app/scripts/install-verapdf.sh') }}
      - name: Fetch xConvert's converters (checksum-pinned) and build its Typst wrapper
        run: npm run vendor --prefix ../xconvert/app
      - name: Test xConvert
        # After the vendor step: the Typst tests run the real wrapper.
        run: npm test --prefix ../xconvert/app

      - name: Build
        # The whole site: the front page into dist/, xNotary into dist/xnotary/,
        # xSignature into dist/xsignature/.
        # No BASE_PATH — /xnotary/ is the default, and setting it to anything
        # else would move xNotary out from under its front page and its CSP rule.
        run: npm run build:only

      - name: Check every host each service's build mentions is accounted for
        # xSignature is allowed one network request — the opt-in timestamp — and
        # xConvert none. A blocklist of known CDNs would only catch the hosts
        # somebody thought to list, so every host each build mentions is compared
        # against that service's hosts-in-build.txt, and anything not written down
        # there fails here.
        run: |
          for service in xsignature xconvert; do
            grep -ohE 'https?://[a-zA-Z0-9._-]+' \
              dist/$service/assets/*.js dist/$service/assets/*.css dist/$service/*.html 2>/dev/null \
              | sed -E 's|https?://||' | sort -u > /tmp/found-hosts.txt
            grep -vE '^\s*(#|$)' ../$service/app/hosts-in-build.txt | awk '{print $1}' | sort -u > /tmp/allowed-hosts.txt
            if comm -23 /tmp/found-hosts.txt /tmp/allowed-hosts.txt | grep -q .; then
              echo "::error::$service's build mentions a host that is not in its hosts-in-build.txt:"
              comm -23 /tmp/found-hosts.txt /tmp/allowed-hosts.txt
              exit 1
            fi
            echo "every host in $service's build is accounted for"
          done
      # pandoc needs WebAssembly exception handling, which Node 18 lacks, so the real
      # conversions are tested in Chrome, against the built site and its real CSP. Every PDF
      # must pass veraPDF as PDF/A-2b: xConvert calls them archival only because they do.
      - name: Install veraPDF (pinned)
        run: npm run verapdf:install --prefix ../xconvert/app
      - name: xConvert end-to-end in Chrome
        run: REQUIRE_VERAPDF=1 npm run e2e --prefix ../xconvert/app
      - name: Check no file is over Cloudflare Pages' 25 MiB limit
        run: |
          big=$(find dist -type f -size +25M)
          if [ -n "$big" ]; then echo "::error::over 25 MiB, Cloudflare Pages would refuse the deploy:"; echo "$big"; exit 1; fi
          echo "every file in dist is under 25 MiB"

      - name: Check every bundled font ships its licence
        # The OFL requires the licence to travel with the font.
        run: |
          found=0
          while IFS= read -r ttf; do
            found=$((found + 1))
            test -f "${ttf%.ttf}.OFL.txt" || { echo "::error::$ttf has no licence beside it"; exit 1; }
          done < <(find ../xsignature/app/src -name '*.ttf')
          test "$found" -gt 0 || { echo '::error::no bundled fonts found — has the layout moved?'; exit 1; }
          echo "$found bundled fonts, each with its licence"

      - name: Check the artifact is the site the apex needs
        # Failures this catches, all silent and all user-visible only after
        # deploying: a dist/ with no security headers because _headers went
        # missing, a CSP rule for /xnotary/ that would be merged into the
        # front page's instead of replacing it, xNotary built for the wrong
        # path, and the root /sw.js missing — without it, visitors who still
        # have the pre-0.5.0 worker would keep the old app at / for good.
        run: |
          test -f dist/_headers || { echo '::error::dist/_headers is missing — the deployment would ship with no CSP'; exit 1; }
          grep -q 'frame-ancestors' dist/_headers || { echo '::error::dist/_headers carries no frame-ancestors directive'; exit 1; }
          grep -A1 '^/xnotary/\*' dist/_headers | grep -q '! Content-Security-Policy' || { echo '::error::the /xnotary/* rule does not detach the general CSP'; exit 1; }
          grep -q 'src="/assets/' dist/index.html || { echo '::error::dist/index.html is not the front page built for /'; exit 1; }
          grep -q 'src="/xnotary/assets/' dist/xnotary/index.html || { echo '::error::dist/xnotary/index.html does not reference /xnotary/assets/ — was BASE_PATH overridden?'; exit 1; }
          if grep -q '/xNotary/' dist/xnotary/index.html; then echo '::error::xNotary still carries the GitHub Pages base path'; exit 1; fi
          grep -q 'src="/xsignature/assets/' dist/xsignature/index.html || { echo '::error::dist/xsignature/index.html does not reference /xsignature/assets/'; exit 1; }
          grep -A1 '^/xsignature/\*' dist/_headers | grep -q '! Content-Security-Policy' || { echo '::error::the /xsignature/* rule does not detach the general CSP'; exit 1; }
          grep -q 'src="/xconvert/assets/' dist/xconvert/index.html || { echo '::error::dist/xconvert/index.html does not reference /xconvert/assets/'; exit 1; }
          grep -A1 '^/xconvert/\*' dist/_headers | grep -q '! Content-Security-Policy' || { echo '::error::the /xconvert/* rule does not detach the general CSP'; exit 1; }
          grep -A2 '^/xconvert/\*' dist/_headers | grep -q "connect-src 'self';" || { echo '::error::the /xconvert/* rule lets xConvert connect beyond this origin'; exit 1; }
          for f in pandoc.wasm.gz typst-pdf.wasm.gz licences/pandoc-COPYING.md licences/fonts-NOTICE.txt; do
            test -s "dist/xconvert/vendor/$f" || { echo "::error::dist/xconvert/vendor/$f is missing"; exit 1; }
          done
          grep -q 'registration.unregister' dist/sw.js || { echo '::error::dist/sw.js, which retires the pre-0.5.0 worker, is missing'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: xnotary-dist
          path: app/dist
          # Long enough that a release can still be re-deployed from the bytes
          # that were tested, rather than rebuilt from a moving toolchain.
          retention-days: 90

  release:
    name: GitHub release
    needs: production
    # Only a tag names a version. A workflow_dispatch on a branch has nothing to
    # release and must not invent one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are the tag's own annotation, so the tag *object* has to be
          # here — a shallow checkout brings the commit without the message that
          # was written for it.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: xnotary-dist
          path: dist

      - name: Package the build for the release page
        # Attaching the built site means whoever deploys it can take it from the
        # release rather than digging a 90-day artifact out of a workflow run.
        # It is also the object the AGPL and LGPL notices inside it describe,
        # published next to the source it was built from.
        run: cd dist && zip -qr "../xnotary-${GITHUB_REF_NAME}-dist.zip" .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ZIP="xnotary-$TAG-dist.zip"

          # Same reason as the gating job: the checked-out tag ref points at the
          # commit, so the message has to be fetched before it can be read.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

          # Re-running a tagged build should attach the rebuilt bytes without
          # overwriting notes a human may have edited on the release since.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — refreshing the build, leaving the notes alone"
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi

          # Subject line is the title, the body is the notes — which is how
          # every release before this one was written by hand.
          git tag -l --format='%(contents:subject)' "$TAG" > title.txt
          git tag -l --format='%(contents:body)' "$TAG" > notes.txt

          # Every release so far is titled "vX.Y.Z — what changed", but the tag
          # message is not always written that way (v0.4.3 was not). Supply the
          # prefix when it is missing rather than asking whoever tags to
          # remember it, and never double it up when it is already there.
          TITLE="$(cat title.txt)"
          case "$TITLE" in
            "$TAG"*) ;;
            *) TITLE="$TAG — $TITLE" ;;
          esac

          # --prerelease is not a placeholder. The README says the
          # "public beta" label stays until the security review and the Czech
          # eIDAS counsel review are actually done, and a release marked stable
          # would be the app claiming more than has been established. Drop this
          # flag when those two land, and not before.
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file notes.txt \
            --prerelease \
            "$ZIP"

  pages-redirect:
    name: Redirect stub on GitHub Pages
    # Gated on the tests: a tag that fails them should leave every origin as it
    # was rather than replace one of them with anything.
    needs: production
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the stub
        # 404.html is a copy of index.html so a path under /xNotary/ redirects
        # as well as the root does. Copied here rather than committed twice so
        # the two cannot drift. pages-redirect/README.md stays out of the
        # artifact — it is documentation for this repo, not a served page.
        run: |
          mkdir -p _site
          cp pages-redirect/index.html _site/index.html
          cp pages-redirect/index.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
