name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 18 to match the floor declared in app/package.json.
          node-version: '18'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        # Offline suite only. The OTS spike hits live calendar servers and block
        # explorers, so it stays out of CI — run it locally with `npm run spike:ots`.
        run: npm test

      - name: Build
        run: npm run build:only

      - name: Check the certificate proof stayed self-contained
        # Cheap guard on principle 3: a Certificate 1 must carry its own proof.
        run: npx vitest run src/lib/certificate1.test.ts
